name: Wardrobe
options:
  bundleIdPrefix: com.shimondeitel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: W7Q885Q59C
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Wardrobe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Wardrobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.samplekit
        DEVELOPMENT_TEAM: W7Q885Q59C
        INFOPLIST_FILE: Wardrobe/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
    info:
      path: Wardrobe/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Wardrobe - Sample Kit
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Wardrobe/Wardrobe.entitlements
      properties: {}
  WardrobeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WardrobeTests
    dependencies:
      - target: Wardrobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.samplekit.tests
        DEVELOPMENT_TEAM: W7Q885Q59C
  WardrobeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WardrobeUITests
    dependencies:
      - target: Wardrobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.samplekit.uitests
        DEVELOPMENT_TEAM: W7Q885Q59C
schemes:
  Wardrobe:
    build:
      targets:
        Wardrobe: all
    test:
      targets:
        - WardrobeTests
        - WardrobeUITests
    run:
      config: Debug
